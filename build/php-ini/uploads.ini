; Local dev only. This machine's PHP loads no php.ini at all (`php --ini` → "none"), so the
; compiled defaults apply: uploads cap out at 2 MB and every image past that fails in the picker
; with Livewire's "failed to upload" — while the modal offers 8 MB. Herd's own 8.4 php.ini caps
; post_max_size at 2M too, so both paths need lifting.
;
; Loaded by pointing an ini scan dir at this folder; `composer dev` does that for the dev server.
upload_max_filesize=64M
post_max_size=64M
display_errors=Off
log_errors=On
