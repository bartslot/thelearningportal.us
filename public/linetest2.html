<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <style>html,body,#map{margin:0;height:100%;}</style>
</head>
<body>
<div id="map"></div>
<script type="module">
  // Same test as linetest.html but importing the SAME vite-optimized maplibre module the app uses.
  import maplibregl from 'http://127.0.0.1:5173/node_modules/.vite/deps/maplibre-gl.js?v=480428f2';
  const style = {
    version: 8,
    projection: { type: 'globe' },
    sky: { 'sky-color': '#0a1230', 'sky-horizon-blend': 0.5, 'horizon-color': '#1a2c5a', 'horizon-fog-blend': 0.5, 'fog-color': '#dcc9a0' },
    sources: {
      route: { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: {
        type: 'LineString', coordinates: [[-9, 38], [-20, 15], [-10, -20], [18, -34], [40, -4], [75, 11]] } } },
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#cfd8cf' } },
      { id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#ff0000', 'line-width': 5 } },
    ],
  };
  window.__testMap = new maplibregl.Map({ container: 'map', style, center: [20, 2], zoom: 2.2, pitch: 28 });
</script>
</body>
</html>
